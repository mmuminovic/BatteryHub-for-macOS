name: BatteryHub
options:
  bundleIdPrefix: com.mmuminovic
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 39KMKDXSBT
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  BatteryHub:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mmuminovic.batteryhub
        PRODUCT_NAME: Battery Hub
        PRODUCT_MODULE_NAME: BatteryHub
        EXECUTABLE_NAME: BatteryHub
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: BatteryHub.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: NO
      configs:
        Release:
          SWIFT_COMPILATION_MODE: wholemodule

schemes:
  BatteryHub:
    build:
      targets:
        BatteryHub: all
    run:
      config: Debug
    archive:
      config: Release
